<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>My Money</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Money">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <button id="eye" aria-label="Mostra o nascondi gli importi"></button>
  <div id="cover" hidden><img class="logo big-logo" src="icons/icon-192.png" alt="My Money"></div>
  <button id="fab" aria-label="Nuova spesa">+<span id="fab-badge" hidden></span></button>
  <nav id="tabbar">
    <button data-tab="dashboard"><i>🏠</i><span>Home</span></button>
    <button data-tab="movimenti"><i>🧾</i><span>Movimenti</span></button>
    <button data-tab="prospetto"><i>📈</i><span>Prospetto</span></button>
    <button data-tab="fisse"><i>📌</i><span>Spese fisse</span></button>
    <button data-tab="impostazioni"><i>⚙️</i><span>Impostazioni</span></button>
  </nav>
  <div id="layer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
